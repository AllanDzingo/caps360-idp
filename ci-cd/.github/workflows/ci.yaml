name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'apps/example-microservice/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/example-microservice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: apps/example-microservice/go.sum

      - name: Build Go App
        working-directory: apps/example-microservice
        run: go build -v ./...

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/example-microservice
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Image Tag in Helm Values
        run: |
          # Use sed to update the tag in both dev and prod values
          # In a real setup, you might promote to dev first, then prod later
          sed -i "s/tag: .*/tag: sha-${GITHUB_SHA::7}/g" apps/example-microservice/manifests/values-dev.yaml
          sed -i "s/tag: .*/tag: sha-${GITHUB_SHA::7}/g" apps/example-microservice/manifests/values-prod.yaml

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update image tag to sha-${{ github.sha }} [skip ci]"
          branch: main
          file_pattern: apps/example-microservice/manifests/*.yaml
